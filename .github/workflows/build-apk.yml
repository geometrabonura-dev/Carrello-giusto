name: Build CarrelloGiusto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CarrelloGiusto
        run: |
          mkdir app
          unzip carrello_giusto_v7_6.zip -d app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        working-directory: app
        run: |
          chmod +x tool/*.sh
          ./tool/bootstrap_flutter.sh

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - name: Build Android APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carrellogiusto-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
