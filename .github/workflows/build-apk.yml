name: Build CarrelloGiusto APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract CarrelloGiusto
        run: |
          mkdir -p app
          unzip -o carrello_giusto_v7_6.zip -d app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        working-directory: app
        run: |
          chmod +x tool/*.sh
          ./tool/bootstrap_flutter.sh

      - name: Fix Flutter build errors
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Fix 1: DemoResultService constructor
          p = Path("lib/services/demo_result_service.dart")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "DemoResultService({this.budgetAnalysis});",
                  "DemoResultService({this.budgetAnalysis = const BudgetAnalysis()});"
              )
              p.write_text(s)
