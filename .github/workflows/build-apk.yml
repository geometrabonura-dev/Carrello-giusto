name: Build CarrelloGiusto v7.7.3 Online Release

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app
        run: |
          mkdir app
          unzip carrello_giusto_v7_7_3_online.zip -d app

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare app
        working-directory: app
        run: |
          chmod +x tool/*.sh
          ./tool/bootstrap_flutter.sh

      - name: Apply compatibility fixes
        working-directory: app
        run: |
          sed -i 's/isRecommended: plan.recommended,/recommended: plan.recommended,/' lib/screens/results_screen.dart
          sed -i 's/isSelected: _selectedKey == plan.key,/selected: _selectedKey == plan.key,/' lib/screens/results_screen.dart
          sed -i 's/return const OptimizationResult(/return OptimizationResult(/' lib/services/demo_result_service.dart
          sed -i 's/)),const SizedBox(height:18)/))),const SizedBox(height:18)/' lib/screens/home_screen.dart
          sed -i 's/p.productTotal.toStringAsFixed(2)/(p.productTotal ?? 0).toStringAsFixed(2)/g; s/p.travelCost.toStringAsFixed(2)/(p.travelCost ?? 0).toStringAsFixed(2)/g; s/p.timeCost.toStringAsFixed(2)/(p.timeCost ?? 0).toStringAsFixed(2)/g; s/p.distanceKm.toStringAsFixed(1)/(p.distanceKm ?? 0).toStringAsFixed(1)/g; s/p.durationMinutes.toStringAsFixed(0)/(p.durationMinutes ?? 0).toStringAsFixed(0)/g' lib/screens/results_screen.dart
      - name: Build Release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CarrelloGiusto-v7.7.3-online-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
